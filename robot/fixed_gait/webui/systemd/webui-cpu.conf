# Drop-in for runningrobot-webui.service (the CAN daemon + flight recorder, :8081).
#
# WHY. Measured on the robot 2026-09-01, robot idle and LIMP: the 200 Hz loop runs at 193 Hz with
# nothing polling and 107 Hz with a browser tab open. The front end already lives in its own
# process (uiproc.py, see its docstring), but nothing stopped the two from landing on the same
# core -- and on a four-core Pi 3B they will, because the scheduler has no reason not to.
#
# So: this process gets cores 0-1, uiproc gets 2-3 (see ui-cpu.conf), and this one runs at a
# higher priority than the front end. Note what this does NOT fix -- the GIL. Inside THIS process
# the CAN thread, the IMU thread, the recorder and Flask's own request threads all serialise on
# one lock however many cores they are given; extra cores only help while a thread is inside numpy
# or an I2C/SPI read, which release it. Across processes, though, affinity and priority are real.
#
# Drop-in rather than an edit, so `rm -r /etc/systemd/system/runningrobot-webui.service.d` is the
# whole rollback.
[Service]
CPUAffinity=0 1
Nice=-10
