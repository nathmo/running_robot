# =============================================================================
# m3_ft  —  the SAME experiment as experiments/m3_ft/, expressed by reference.
#
# M3 Fourier fine-tune: X, Z, pitch free; Fourier cyclic gait; run forward as fast as
# possible; warm-started from m2_fourier. Everything else is inherited from the library
# base `dash01_fourier` (-> dash01_speed -> dash01_base). This is the ease-of-use
# payoff: a few meaningful lines instead of a six-file folder.
#
# You only drop in a local reward.py / observation.py / curriculum.py when you want to
# change one of those — see experiments/m3_ft/ for what that looks like.
# Check it:   .venv/Scripts/python.exe -m framework.validate experiments/m3_ft_clean --diff
# Train it:   .venv/Scripts/python.exe -m rl.train --experiment experiments/m3_ft_clean
# =============================================================================

name: m3_ft
description: "M3 Fourier fine-tune from m2_fourier: free the pitch DOF on top of X,Z and keep sprinting forward."
inherits: dash01_fourier                            # legs = pattern_gen + reflex, speed obj, fourier PPO

base_dof: [free, lock, free, lock, free, lock]      # X  Y  Z  roll  pitch  yaw   -> X,Z,pitch free (M3)

run:
  warm_start: runs/m2_fourier/final_model.zip       # the "ft" — dims match, loads as-is
