# =============================================================================
# m3_ft  —  M3 Fourier fine-tune  (== the `m3_fourier` preset)
# X, Z, pitch free; Y, roll, yaw railed. Fourier cyclic gait, run forward as fast
# as possible. Warm-started from m2_fourier (that's the "ft").
#
# This is the FULL / explicit form: every one of the 11 axes is spelled out, and the
# reward / observation / network / curriculum / steering are LOCAL python files you
# can edit per-experiment. Compare with experiments/m3_ft_clean/, which is the SAME
# experiment expressed in a few lines by inheriting a library base.
# Check it:   .venv/Scripts/python.exe -m framework.validate experiments/m3_ft --diff
# =============================================================================

name: m3_ft
description: "M3 Fourier fine-tune (explicit form): every axis spelled out, all module escape hatches demonstrated."
inherits: dash01_base          # plant + timing + PPO defaults; this file overrides on top

# --- ① plant -----------------------------------------------------------------
plant:
  model: mujoco/dash01/dash01.xml
  keyframe: stand
  control_hz: 50               # 1 kHz sim / control_decimation 20

# --- ④ base DOF restriction   [X, Y, Z, roll, pitch, yaw] --------------------
base_dof:
  X:     free
  Y:     {lock: 0}
  Z:     free                  # M3: robot carries its own ride height (height/vz terms live)
  roll:  {lock: 0}
  pitch: free
  yaw:   {lock: 0}

# --- ② + ③ per-joint controllers  (+ symmetry) ------------------------------
# Only actuated joints are listed. knee_L/R (loop-driven) and ankle_L/R (spring) are
# structural in the model, not configured here.
joints:
  cam_L:      {controller: pattern_gen, n_harmonics: 3, amp: 0.30, freq_hz: [0.5, 3.0], drives: position}
  thigh_L:    {controller: pattern_gen, n_harmonics: 3, amp: 0.35, freq_hz: [0.5, 3.0], drives: position}
  hip_roll_L: {controller: reflex, inputs: [roll, roll_rate], gains: learned,
               kp_scale: 0.5, kd_scale: 0.1, bias_scale: 0.2}

symmetry:
  # Right leg = mirror of the left. phase is decomposed into two ENUM choices:
  #   mode: inphase | antiphase | offset        (offset also needs offset_rad)
  #   tune: fixed   | action   | obs            (action -> one extra policy output)
  # The runtime currently implements antiphase + tune=fixed only (rl/fourier_gait.py
  # mirrors at a hard pi offset); tune=action is future work and the compiler says so.
  gait_pair:
    mirror: {cam_R: cam_L, thigh_R: thigh_L, hip_roll_R: hip_roll_L}
    sign: -1
    phase: {mode: antiphase, tune: fixed}

# --- ⑤ observation  (local module) ------------------------------------------
observation:
  module: ./observation.py         # returns one feature frame; framework stacks history_len
  history_len: 5

# --- ⑥ command / task --------------------------------------------------------
command:
  mode: speed                  # speed_mode: forward-only, pinned at the ceiling (no tracking)
  vx_max: 2.5
  forward_only: true
  p_stand: 0.0

# --- ⑦ reward  (local module — edit freely) ---------------------------------
reward:
  module: ./reward.py          # def reward(state, cmd, cfg) -> {term_name: value}

# --- ⑧ curriculum  (local module) -------------------------------------------
curriculum:
  module: ./curriculum.py

# --- ⑨ network / RL ----------------------------------------------------------
policy:
  hidden: [256, 256]
  activation: tanh
  module: ./network.py         # architecture escape hatch (reproduces the default here)
ppo:
  gamma: 0.93                  # macro-step = one gait cycle -> short horizon
  n_steps: 256
  batch_size: 512
  total_steps: 800_000
  # lr / clip / gae / entropy schedule inherited from dash01_base

# --- ⑩ backend ---------------------------------------------------------------
backend:
  device: cpu                  # pattern_gen is unsupported on MJX -> CPU / SB3
  n_envs: auto

# --- ⑪ run / deploy / safety -------------------------------------------------
run:
  warm_start: runs/m2_fourier/final_model.zip    # fine-tune ("ft"); dims match (obs 220 / act 18)
  checkpoint_every: 200_000
  outputs: [csv, plots, tensorboard]
steering: ./steering.py        # scripted command profile for eval (optional)
deploy:
  export: onnx
  target: moteus
  per_joint: from_controllers  # pattern_gen + reflex both resolve to position -> SET_POS
safety:
  terminate_on: [fall, tilt_60deg, floor_blowup]
  sim2sim_gate: gait_probe     # must PASS the skating gate before hardware
