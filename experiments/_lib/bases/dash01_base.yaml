# Library base — the DASH-01 plant with sane defaults (mirrors rl/config.py Config
# defaults; enforced by tests/test_preset_parity.py via the `default` preset encoding).
# Experiments inherit this and override only what differs.
name: dash01_base

plant:
  model: mujoco/dash01/dash01.xml
  keyframe: stand
  control_hz: 50                                   # 1 kHz sim / decimation 20

base_dof: [free, free, free, free, free, free]     # M6 (all free) unless overridden

observation:
  module: standard                                 # built-in frame (motor+IMU+prev_action+cmd)
  history_len: 5
  scales: {motor_pos: 1.0, motor_vel: 0.1, motor_torque: 0.01, gravity: 1.0, ang_vel: 0.25}

command:
  mode: joystick                                   # [forward, yaw]; (0,0) = stand
  vx_max: 1.5
  yaw_max: 2.0
  p_stand: 0.2
  episode_s: 20.0

reward: gait_speed_v3                              # built-in v3 reward (all command modes)

policy: {hidden: [256, 256], activation: tanh}

ppo:
  total_steps: 20_000_000
  n_steps: 1024
  batch_size: 4096
  n_epochs: 4
  gamma: 0.995
  gae_lambda: 0.95
  learning_rate: 3.0e-4
  lr_final: 1.0e-4
  clip_range: 0.2
  target_kl: 0.03
  entropy: {coef: 0.01, final: 0.002, anneal_steps: 4_000_000, gate_air_time: 0.02, max_log_std: 0.0}
  seed: 0

backend: {device: cpu, n_envs: auto}

safety:
  terminate_on: [fall, tilt_60deg, floor_blowup]
  term_height: 0.45

run:
  checkpoint_every: 200_000
  outputs: [csv, plots, tensorboard]

deploy: {export: onnx, target: moteus, per_joint: from_controllers}
