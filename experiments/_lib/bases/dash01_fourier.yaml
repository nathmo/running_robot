# Library base — DASH-01 with the Fourier cyclic-gait controllers + max-speed
# objective. This is what makes a per-experiment fourier file tiny: it carries the
# per-joint controllers, the L/R symmetry, the speed command and the fourier PPO
# overrides. A milestone file then only sets base_dof (+ warm_start).
#
# NOTE phase.tune is FIXED: the runtime (rl/fourier_gait.py) mirrors the right leg at
# a hard phase offset of pi. The network-tuned L/R phase delta (tune: action) is future
# work — the compiler rejects it until it exists.
name: dash01_fourier
inherits: dash01_speed

joints:
  cam_L:      {controller: pattern_gen, n_harmonics: 3, amp: 0.30, freq_hz: [0.5, 3.0], drives: position}
  thigh_L:    {controller: pattern_gen, n_harmonics: 3, amp: 0.35, freq_hz: [0.5, 3.0], drives: position}
  hip_roll_L: {controller: reflex, inputs: [roll, roll_rate], gains: learned,
               kp_scale: 0.5, kd_scale: 0.1, bias_scale: 0.2}

symmetry:
  gait_pair:
    mirror: {cam_R: cam_L, thigh_R: thigh_L, hip_roll_R: hip_roll_L}
    sign: -1
    phase: {mode: antiphase, tune: fixed}

ppo: {gamma: 0.93, n_steps: 256, batch_size: 512, total_steps: 800_000}   # macro-step horizon

backend: {device: cpu}                             # pattern_gen unsupported on MJX
