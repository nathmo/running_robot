# == rl/config.py `m2_walk` (v3): stand + walk FORWARD, free-floating. Move commands
# >= 0.3 m/s from the first step (no protected low-speed regime), ramped 0.3 -> 0.6 over
# 4M steps; forward-only; gentle pushes on.
name: m2_walk
description: "M2 legacy v3: forward walking on the free-floating plant, min-command 0.3 m/s, pushes on."
inherits: dash01_base

command:
  vx_max: 1.0
  forward_only: true
  p_stand: 0.10
  vx_frac: 0.6
  vx_min_frac: 0.3

curriculum:
  module: cmd_ramp
  params: {start: 0.3, steps: 4_000_000}

safety:
  push_interval_s: 5.0
