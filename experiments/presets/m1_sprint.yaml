# == rl/config.py `m1_sprint`: M1 rail 100 m dash, per-step PD policy. gamma lowered so
# farming the stop-phase income can never out-value the finish bonus; w_alive=0 (a
# sprinter must not be paid per second of existence — the clock cost prices time).
name: m1_sprint
description: "100 m dash on the M1 ride-height rail, PD policy: run to the line, then stop."
inherits: dash01_speed

base_dof: [free, lock, {rail: [0.90, 1.03]}, lock, lock, lock]

command:
  mode: sprint
  episode_s: 60.0
  sprint: {curriculum_steps: 6_000_000}            # line ramps 25 -> 100 m

reward:
  module: gait_speed_v3
  params: {w_alive: 0.0}

ppo: {gamma: 0.99}
