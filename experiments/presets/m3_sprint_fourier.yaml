# == rl/config.py `m3_sprint_fourier`: X, Z, pitch free 100 m dash with the Fourier
# gait — the body must also stabilize fore/aft attitude while it sprints.
name: m3_sprint_fourier
description: "100 m dash with X,Z,pitch free and the Fourier gait policy."
inherits: dash01_fourier

base_dof: [free, lock, free, lock, free, lock]

command:
  mode: sprint
  episode_s: 60.0
  sprint: {curriculum_steps: 400_000}

reward:
  module: gait_speed_v3
  params: {w_alive: 0.0}
